<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Khung sườn robot — đúng bản vẽ 2D</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, sans-serif; background: #fff; color: #111; overflow: hidden; }
    #toolbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; gap: 8px; padding: 10px 14px;
      background: #fff; border-bottom: 1px solid #ccc;
    }
    #toolbar button {
      padding: 8px 14px; border: 1px solid #888; border-radius: 6px;
      background: #fff; cursor: pointer; font-size: 13px;
    }
    #toolbar button.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    #wrap { margin-top: 49px; width: 100vw; height: calc(100vh - 49px); overflow: auto; }
    #view2d { display: block; margin: 20px auto; background: #fff; }
    #view3d { display: none; width: 100%; height: calc(100vh - 49px); background: #eee; }
    .edge { stroke: #000; stroke-width: 2; fill: none; stroke-linejoin: miter; stroke-linecap: butt; }
    .inner6 { stroke: #000; stroke-width: 1.2; fill: none; }
    .dot { fill: #000; }
    .lbl { font: 14px/1 system-ui; fill: #000; text-anchor: middle; }
    .sub { font: 12px system-ui; fill: #444; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btn2d" class="active">2D — bản vẽ</button>
    <button id="btn3d">3D — khung đôi</button>
  </div>

  <div id="wrap">
    <!--
      Hình sườn (cm) — chiều kim đồng hồ từ góc đáy trái (0,0)
      Đáy 4 → xiên phải 1,4 → dọc phải 2,6 → xiên 1 → ngang 3 → xiên 2,8 → dọc trái 1,5 → xiên trái 1,4
      Ngang trong 6,3 nối 2 điểm eo trái/phải
    -->
    <svg id="view2d" width="520" height="420" viewBox="0 0 520 420">
      <g transform="translate(80, 340) scale(28, -28)">
        <!-- Khung chính -->
        <polyline class="edge" points="
          0,0  4,0  5.15,0.7983  5.15,3.3983  4.626,2.546  1.626,2.546
          -1.15,2.2983  -1.15,0.7983  0,0
        "/>
        <!-- 6,3 cm (eo khung — không phải cạnh ngoài) -->
        <line class="inner6" x1="-1.15" y1="0.7983" x2="5.15" y2="0.7983"/>
        <!-- Chấm đen: góc 1,5 + 2,8 -->
        <circle class="dot" cx="-1.15" cy="2.2983" r="0.06"/>
      </g>

      <!-- Nhãn kích thước (px, đặt tay giống bản vẽ) -->
      <text class="lbl" x="190" y="355">4</text>
      <text class="lbl" x="300" y="330">1,4</text>
      <text class="lbl" x="318" y="250">2,6</text>
      <text class="lbl" x="340" y="215">1</text>
      <text class="lbl" x="260" y="195">3</text>
      <text class="lbl" x="130" y="210">2,8</text>
      <text class="lbl" x="55" y="265">1,5</text>
      <text class="lbl" x="95" y="330">1,4</text>
      <text class="lbl" x="195" y="305">6,3</text>

      <!-- Mũi tên chấm đen -->
      <line x1="95" y1="230" x2="55" y2="248" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
      <defs>
        <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#000"/>
        </marker>
      </defs>

      <!-- Thanh 3,2 + phôi 18 (minh họa bản vẽ gốc) -->
      <g transform="translate(380, 60)">
        <text class="lbl" x="20" y="-8">3,2</text>
        <g id="rungs"></g>
      </g>
      <g transform="translate(80, 380)">
        <line class="edge" x1="0" y1="0" x2="504" y2="0"/>
        <line class="edge" x1="0" y1="14" x2="504" y2="14"/>
        <text class="lbl" x="260" y="32">18</text>
        <text class="sub" x="0" y="52">2 thanh thẳng 18 cm → uốn thành 2 vòng sườn</text>
      </g>
      <text class="sub" x="80" y="30">Đơn vị: cm · 1 vòng sườn ≈ 17,7 cm (+ bo góc ≈ 18)</text>
    </svg>
    <div id="view3d"></div>
  </div>

  <script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }}
  </script>
  <script type="module">
    // Đỉnh khung (cm) — chiều kim đồng hồ từ đáy trái
    const PROFILE = [
      { x: 0, y: 0,           label: '4' },       // → (4,0)
      { x: 4, y: 0,           label: '1,4' },     // → right waist
      { x: 5.15, y: 0.7983,  label: '2,6' },
      { x: 5.15, y: 3.3983,  label: '1' },
      { x: 4.626, y: 2.546,  label: '3' },
      { x: 1.626, y: 2.546,  label: '2,8' },
      { x: -1.15, y: 2.2983, label: '1,5' },     // chấm đen
      { x: -1.15, y: 0.7983, label: '1,4' },
    ];

    const len = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
    const segs = PROFILE.map((p, i) => {
      const q = PROFILE[(i + 1) % PROFILE.length];
      return `${p.label}: ${len(p, q).toFixed(2)}`;
    });
    console.log('Kiểm tra cạnh:', segs.join(' | '));

    // 10 thanh ngang 3,2 cm (bên phải bản vẽ)
    const rungs = document.getElementById('rungs');
    for (let i = 0; i < 10; i++) {
      const y = i * 12;
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', '0'); ln.setAttribute('y1', y);
      ln.setAttribute('x2', '56'); ln.setAttribute('y2', y);
      ln.setAttribute('class', 'edge');
      ln.setAttribute('stroke-width', '1.5');
      rungs.appendChild(ln);
    }

    const btn2d = document.getElementById('btn2d');
    const btn3d = document.getElementById('btn3d');
    const view2d = document.getElementById('view2d');
    const view3d = document.getElementById('view3d');
    const wrap = document.getElementById('wrap');

    btn2d.onclick = () => {
      view2d.style.display = 'block';
      view3d.style.display = 'none';
      wrap.style.overflow = 'auto';
      btn2d.classList.add('active'); btn3d.classList.remove('active');
    };
    btn3d.onclick = () => {
      view2d.style.display = 'none';
      view3d.style.display = 'block';
      wrap.style.overflow = 'hidden';
      btn3d.classList.add('active'); btn2d.classList.remove('active');
      if (!view3d.dataset.ok) init3d();
    };

    function init3d() {
      view3d.dataset.ok = '1';
      Promise.all([
        import('three'),
        import('three/addons/controls/OrbitControls.js'),
      ]).then(([THREE, { OrbitControls }]) => {
        const S = 0.01, W = 3.2, R = 0.055 * S;
        const mat = new THREE.MeshStandardMaterial({ color: 0xb8860b, metalness: 0.85, roughness: 0.35 });

        function wireAt(z) {
          const g = new THREE.Group();
          for (let i = 0; i < PROFILE.length; i++) {
            const a = PROFILE[i], b = PROFILE[(i + 1) % PROFILE.length];
            const s = new THREE.Vector3(a.x * S, a.y * S, z * S);
            const e = new THREE.Vector3(b.x * S, b.y * S, z * S);
            const d = new THREE.Vector3().subVectors(e, s);
            const L = d.length();
            if (L < 1e-9) continue;
            const c = new THREE.CylinderGeometry(R, R, L, 6);
            const m = new THREE.Mesh(c, mat);
            m.position.copy(s.clone().add(e).multiplyScalar(0.5));
            m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
            g.add(m);
          }
          return g;
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f5);
        const camera = new THREE.PerspectiveCamera(42, view3d.clientWidth / view3d.clientHeight, 0.001, 20);
        camera.position.set(0.09, 0.06, 0.11);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(view3d.clientWidth, view3d.clientHeight);
        view3d.appendChild(renderer.domElement);
        const ctrl = new OrbitControls(camera, renderer.domElement);
        ctrl.target.set(0.02, 0.017, 0.016);
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dl = new THREE.DirectionalLight(0xffffff, 0.8);
        dl.position.set(0.4, 0.6, 0.5);
        scene.add(dl);
        const frame = new THREE.Group();
        frame.add(wireAt(0), wireAt(W));
        scene.add(frame);
        (function loop() { requestAnimationFrame(loop); ctrl.update(); renderer.render(scene, camera); })();
        addEventListener('resize', () => {
          camera.aspect = view3d.clientWidth / view3d.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(view3d.clientWidth, view3d.clientHeight);
        });
      });
    }
  </script>
</body>
</html>
